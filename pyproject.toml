[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-guard-kit"
version = "0.1.0a1"
description = "Tenant-isolated credential brokering, deny-by-default capabilities, and typed audit sanitization for AI agents."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "AgentGuardKit Maintainers" }
]
keywords = [
    "ai-agents",
    "security",
    "vault",
    "credentials",
    "governance",
    "mcp",
    "llm-security"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "build>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/techmsd/agent-guard-kit"
Documentation = "https://github.com/techmsd/agent-guard-kit/tree/main/docs"
Repository = "https://github.com/techmsd/agent-guard-kit.git"
Issues = "https://github.com/techmsd/agent-guard-kit/issues"
Changelog = "https://github.com/techmsd/agent-guard-kit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguardkit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
per-file-ignores = {"tests/*" = ["E402"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
files = ["src/agentguardkit"]
