name: Publish Release

on:
  push:
    tags:
      - 'v0.[0-9]+.[0-9]+a[0-9]+'  # Only explicit semver pre-release alpha tags
  workflow_dispatch:
    inputs:
      target:
        description: 'Target package index'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi
      confirm_release:
        description: 'Type "CONFIRM_RELEASE" to proceed'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # =========================================================================
  # Stage 1: Build & Verify (Quality & Security Gate)
  # =========================================================================
  build-and-verify:
    name: Build & Verify Release Candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine ruff mypy pytest pytest-cov

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy Strict Type Check
        run: |
          mypy src/agentguardkit

      - name: Run Pytest Suite with Coverage (>= 90%)
        run: |
          pytest --cov=agentguardkit --cov-fail-under=90

      - name: Run Secret Scan
        run: |
          python -c "
          import os, re, sys
          PATTERNS = [
              re.compile(r'(?i)(password|secret_key|private_key|api_key|access_token)\s*=\s*[\x27\x22][^\x27\x22]{8,}[\x27\x22]'),
              re.compile(r'AKIA[0-9A-Z]{16}'),
              re.compile(r'ghp_[A-Za-z0-9_]{36}'),
              re.compile(r'-----BEGIN (?:RSA )?PRIVATE KEY-----'),
          ]
          findings = []
          for root, _, files in os.walk('.'):
              if any(p in root for p in ['.git', '.venv', '__pycache__', 'dist']): continue
              for f in files:
                  if f.endswith(('.py', '.md', '.toml', '.yml', '.yaml')):
                      with open(os.path.join(root, f), 'r', encoding='utf-8', errors='ignore') as h:
                          for idx, line in enumerate(h, 1):
                              for pat in PATTERNS:
                                  if pat.search(line) and not any(k in line for k in ['REDACTED', 'SYNTHETIC', 'synthetic']):
                                      findings.append((f, idx, line.strip()))
          if findings:
              print('Potential secrets detected:', file=sys.stderr)
              for f, idx, l in findings:
                  print(f'{f}:{idx}: {l}', file=sys.stderr)
              sys.exit(1)
          print('Secret scan passed: 0 leaks found.')
          "

      - name: Build Source and Binary Distributions
        run: python -m build

      - name: Validate Package Metadata with Twine
        run: twine check --strict dist/*

      - name: Upload Build Distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 1

  # =========================================================================
  # Stage 2: Publish (Gated behind Protected Environment & Manual Review)
  # =========================================================================
  publish-release:
    name: Publish to PyPI
    needs: [build-and-verify]
    runs-on: ubuntu-latest
    environment:
      # Protected GitHub Environment requiring human reviewer sign-off
      name: ${{ github.event.inputs.target == 'pypi' && 'pypi-production' || 'pypi-test' }}
      url: ${{ github.event.inputs.target == 'pypi' && 'https://pypi.org/p/agent-guard-kit' || 'https://test.pypi.org/p/agent-guard-kit' }}
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing OIDC

    steps:
      - name: Verify Release Confirmation Keyword
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_release != 'CONFIRM_RELEASE'
        run: |
          echo "ERROR: Confirmation keyword does not match 'CONFIRM_RELEASE'. Aborting."
          exit 1

      - name: Download Build Distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Publish to Production PyPI
        if: github.event_name == 'push' || github.event.inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
