name: Publish Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target index: "testpypi" or "pypi"'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi
      version_tag:
        description: 'Release version tag matching pyproject.toml (e.g. v0.1.0a1)'
        required: true
        type: string
      confirm_release:
        description: 'Type "CONFIRM_RELEASE" to authorize execution'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # =========================================================================
  # Stage 1: Build, Verify & Validate Inputs (Quality & Security Gate)
  # =========================================================================
  build-and-verify:
    name: Build & Verify Release Candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate Release Inputs & Tagged Commit
        env:
          CONFIRM_RELEASE: ${{ github.event.inputs.confirm_release }}
          INPUT_TAG: ${{ github.event.inputs.version_tag }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
        run: |
          # 1. Validate confirmation keyword
          if [ "${CONFIRM_RELEASE}" != "CONFIRM_RELEASE" ]; then
            echo "ERROR: Confirmation keyword does not match 'CONFIRM_RELEASE'." >&2
            exit 1
          fi

          # 2. Extract canonical version from pyproject.toml on main
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          EXPECTED_TAG="v${PROJECT_VERSION}"

          echo "pyproject.toml version: ${PROJECT_VERSION}"
          echo "Expected tag: ${EXPECTED_TAG}"
          echo "Provided tag: ${INPUT_TAG}"

          # 3. Verify tag matches pyproject.toml version exactly
          if [ "${INPUT_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "ERROR: Provided version tag '${INPUT_TAG}' does not match pyproject.toml version '${EXPECTED_TAG}'." >&2
            exit 1
          fi

          # 4. Verify tag adheres to approved semver release pattern
          if ! [[ "${INPUT_TAG}" =~ ^v0\.[0-9]+\.[0-9]+(a[0-9]+|b[0-9]+|rc[0-9]+)?$ ]]; then
            echo "ERROR: Tag '${INPUT_TAG}' is not an authorized semver release pattern." >&2
            exit 1
          fi

          # 5. Fetch all remote tags and origin/main to ensure accurate ref verification
          git fetch origin main --tags

          # 6. Verify that the release tag actually exists in the repository
          if ! git rev-parse -q --verify "refs/tags/${INPUT_TAG}" >/dev/null; then
            echo "ERROR: Release tag '${INPUT_TAG}' does not exist in repository." >&2
            exit 1
          fi

          # 7. Verify that the tag resolves to the approved main commit
          TAG_COMMIT=$(git rev-parse "refs/tags/${INPUT_TAG}^{commit}")
          MAIN_COMMIT=$(git rev-parse "refs/remotes/origin/main^{commit}")

          echo "Tag commit:  ${TAG_COMMIT}"
          echo "Main commit: ${MAIN_COMMIT}"

          if [ "${TAG_COMMIT}" != "${MAIN_COMMIT}" ]; then
            echo "ERROR: Tag '${INPUT_TAG}' (${TAG_COMMIT}) does not resolve to approved main commit (${MAIN_COMMIT})." >&2
            exit 1
          fi

          echo "Release inputs, tag existence, and commit alignment verified successfully."

      - name: Checkout Verified Tagged Commit
        env:
          INPUT_TAG: ${{ github.event.inputs.version_tag }}
        run: |
          git checkout "${INPUT_TAG}"
          echo "Checked out verified tag commit: $(git rev-parse HEAD)"

      - name: Install package and consistent dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install twine

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy Strict Type Check
        run: |
          mypy src/agentguardkit

      - name: Run Pytest Suite with Coverage (>= 90%)
        run: |
          pytest --cov=agentguardkit --cov-fail-under=90

      - name: Run Secret Scan
        run: |
          python -c "
          import os, re, sys
          PATTERNS = [
              re.compile(r'(?i)(password|secret_key|private_key|api_key|access_token)\s*=\s*[\x27\x22][^\x27\x22]{8,}[\x27\x22]'),
              re.compile(r'AKIA[0-9A-Z]{16}'),
              re.compile(r'ghp_[A-Za-z0-9_]{36}'),
              re.compile(r'-----BEGIN (?:RSA )?PRIVATE KEY-----'),
          ]
          findings = []
          for root, _, files in os.walk('.'):
              if any(p in root for p in ['.git', '.venv', '__pycache__', 'dist']): continue
              for f in files:
                  if f.endswith(('.py', '.md', '.toml', '.yml', '.yaml')):
                      with open(os.path.join(root, f), 'r', encoding='utf-8', errors='ignore') as h:
                          for idx, line in enumerate(h, 1):
                              for pat in PATTERNS:
                                  if pat.search(line) and not any(k in line for k in ['REDACTED', 'SYNTHETIC', 'synthetic']):
                                      findings.append((f, idx, line.strip()))
          if findings:
              print('Potential secrets detected:', file=sys.stderr)
              for f, idx, l in findings:
                  print(f'{f}:{idx}: {l}', file=sys.stderr)
              sys.exit(1)
          print('Secret scan passed: 0 leaks found.')
          "

      - name: Build Source and Binary Distributions
        run: python -m build

      - name: Validate Package Metadata with Twine
        run: twine check --strict dist/*

      - name: Verify Clean Wheel Installation
        run: |
          python -m venv test_env
          ./test_env/bin/pip install dist/*.whl
          ./test_env/bin/python -c "import agentguardkit; print('Installed version:', agentguardkit.__version__)"

      - name: Upload Build Distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 1

  # =========================================================================
  # Stage 2A: Publish to TestPyPI (Isolated Job & Fixed Environment)
  # =========================================================================
  publish-testpypi:
    name: Publish to TestPyPI (Staging)
    needs: [build-and-verify]
    if: ${{ github.event.inputs.target == 'testpypi' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi-test
      url: https://test.pypi.org/p/agent-guard-kit
    permissions:
      id-token: write  # OIDC token permission for TestPyPI trusted publishing

    steps:
      - name: Download Build Distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  # =========================================================================
  # Stage 2B: Publish to Production PyPI (Isolated Job & Fixed Environment)
  # =========================================================================
  publish-production:
    name: Publish to Production PyPI
    needs: [build-and-verify]
    if: ${{ github.event.inputs.target == 'pypi' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi-production
      url: https://pypi.org/p/agent-guard-kit
    permissions:
      id-token: write  # OIDC token permission for Production PyPI trusted publishing

    steps:
      - name: Download Build Distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to Production PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
