name: CI

on:
  push:
    branches: [ main, "fix/*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy Type Checker
        run: |
          mypy src/agentguardkit

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=agentguardkit --cov-report=term-missing --cov-fail-under=90

      - name: Run Secret Scan
        run: |
          python -c "
          import os, re, sys
          PATTERNS = [
              re.compile(r'(?i)(password|secret_key|private_key|api_key|access_token)\s*=\s*[\x27\x22][^\x27\x22]{8,}[\x27\x22]'),
              re.compile(r'AKIA[0-9A-Z]{16}'),
              re.compile(r'ghp_[A-Za-z0-9_]{36}'),
              re.compile(r'-----BEGIN (?:RSA )?PRIVATE KEY-----'),
          ]
          findings = []
          for root, dirs, files in os.walk('.'):
              if any(p in root for p in ['.git', '.venv', '__pycache__', 'dist']):
                  continue
              for f in files:
                  if f.endswith(('.py', '.md', '.toml', '.yml', '.yaml')):
                      path = os.path.join(root, f)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as h:
                          for idx, line in enumerate(h, 1):
                              for pat in PATTERNS:
                                  if pat.search(line):
                                      if 'REDACTED' in line or 'SYNTHETIC' in line or 'synthetic' in line:
                                          continue
                                      findings.append((path, idx, line.strip()))
          if findings:
              print('Potential secrets detected:', file=sys.stderr)
              for p, idx, l in findings:
                  print(f'{p}:{idx}: {l}', file=sys.stderr)
              sys.exit(1)
          print('Secret scan passed: 0 leaks found.')
          "

      - name: Build Package Distribution
        run: |
          python -m build
